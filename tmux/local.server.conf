# tmux overrides for DOTFILES_PROFILE=server (the headless Mac mini `hal`).
#
# dotbot-conf/base.yaml links this to ~/.config/tmux/local.conf for the server
# profile only, before install_tmux.sh starts any tmux server. tmux/tmux.conf
# sources that machine-local slot just before `run tpm`, so these settings are
# in place when the plugins load. Desk installs link nothing there.

# tmux/tmux.general.conf turns continuum-boot on for the desk Macs. With it on,
# every tmux server that loads tmux-continuum writes
# ~/Library/LaunchAgents/Tmux.Start.plist, a login item that opens iTerm and
# tmux. hal is headless, its LaunchAgents are its live services, and it has no
# iTerm. With it off, continuum removes that one plist if it exists and nothing
# else.
set -g @continuum-boot 'off'

# Drag-to-copy over SSH, even in full-screen TUIs. The default MouseDrag1Pane
# hands the drag to any app that has turned on mouse reporting (the Hermes TUI,
# Claude Code), so tmux never starts a selection and nothing reaches the
# clipboard. Here tmux always takes the drag. On release, copy-mode-vi's
# MouseDragEnd1Pane copies the selection (tmux.general.conf), and
# set-clipboard sends it to the Mac clipboard over OSC 52. Clicks and the
# scroll wheel still go to the app; only left-drag is taken.
bind -n MouseDrag1Pane if -F '#{pane_in_mode}' { send-keys -M } { copy-mode -M }
