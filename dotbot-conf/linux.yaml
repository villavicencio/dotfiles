# Linux-only install layer. Runs AFTER dotbot-conf/base.yaml.
#
# Active target since 2026-09-24: WSL Ubuntu 24.04 on the Windows gaming PC
# (VIL-148). The Hetzner VPS target was retired 2026-05-21. The en_US.UTF-8
# locale generation (and the zsh it needs for Oh My Zsh) lives in base.yaml
# (uname-guarded) because it must run before the helpers base runs.

- defaults:
    link:
      relink: true
    shell:
      quiet: true
      stdout: true
      stderr: true

- link:
    # Seed glyph + palette metadata for a static Linux window layout. The
    # client-attached hook in tmux/tmux.general.conf applies it on next attach.
    # macOS deliberately does NOT link this — its sidecar is written live by the
    # tmux-window-namer skill.
    ~/.config/tmux/window-meta.json: tmux/window-meta.linux.json

- shell:
    # Same shape as darwin.yaml's chsh: without it a Linux login (a WSL tab)
    # lands in bash and none of zsh/ is loaded. Skipped in CI (PAM auth fails
    # on hosted runners) and when zsh is already the login shell. chsh prompts
    # for the user's password, which is fine: on WSL ./install is run
    # interactively by the user (sudo needs the password anyway).
    - command: |
        if [ "${DOTFILES_DRY_RUN:-0}" = "1" ]; then
          echo "[dry-run] would chsh -s $(command -v zsh || echo zsh)"
        elif [ "${CI:-false}" != "true" ] && command -v zsh >/dev/null 2>&1 \
            && [ "$(getent passwd "$USER" | cut -d: -f7)" != "$(command -v zsh)" ]; then
          chsh -s "$(command -v zsh)"
        else
          echo "skipping chsh (CI, zsh missing, or zsh already the login shell)"
        fi
      description: Making zsh the default shell (skipped in CI / if already zsh)
    - command: echo "Installation complete!"
      quiet: false
