# Otty terminal config — tracked baseline.
#
# SEEDED BY COPY, NOT SYMLINKED. `otty config set` (and the Settings UI)
# writes via temp-file + atomic rename, which REPLACES the path and would
# silently orphan a symlink back into this repo. helpers/install_otty.sh
# copies this file to ~/.config/otty/config.toml only when that file is
# absent, so a live config is never clobbered.
#
# To capture live changes back into the repo:
#   dot drift                                 # see what diverged
#   bash helpers/install_otty.sh --capture    # regenerate this file, then commit
#
# Generated from `otty config show` (otty 1.3.1) — the normalized, lossless
# form. Do not paste the raw ~/.config/otty/config.toml here: the app appends
# a growing tail of `# key = value (reset to default)` comment cruft.

# Font
font-ligatures = "calt"

# Theme
theme = "com.googlecode.iterm2"
theme-dark = "Nord"
auto-theme-dark-mode = false

# Command & Environment

# Working Directory

# Terminal Identity

# Scrollback

# Window
sidebar-width = 416

# Colors
foreground = "#c0c3cb"
background = "#031b21"
palette-0 = "#21252b"
palette-1 = "#c98389"
palette-2 = "#9ab488"
palette-3 = "#e5c07b"
palette-4 = "#7dacd3"
palette-5 = "#bb8cc9"
palette-6 = "#56b6c2"
palette-7 = "#abb2bf"
palette-8 = "#767676"
palette-9 = "#c98389"
palette-10 = "#9ab488"
palette-11 = "#e5c07b"
palette-12 = "#7dacd3"
palette-13 = "#bb8cc9"
palette-14 = "#56b6c2"
palette-15 = "#abb2bf"
selection-foreground = "#abb2bf"
selection-background = "#323844"

# Transparency

# Dock Icon

# Cursor
cursor-color = "#c678de"
cursor-text = "#abb2bf"
cursor-animation = "smooth"

# Mouse & Input
macos-option-as-alt = true
file-open-with = "otty"

# Clipboard
clipboard-trim-trailing-spaces = true
copy-on-select = true

# UI Chrome

# Autocomplete

# Privileges
privilege-notification-on-finish = true
privilege-caffeinate-agent-processing = true

